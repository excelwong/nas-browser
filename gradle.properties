org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
android.useAndroidX=true
kotlin.code.style=official
android.nonTransitiveRClass=true
org.gradle.daemon=false
android.suppressUnsupportedCompileSdk=35
# Resilience for throttled / resetting network: long timeouts + aggressive HTTP retry.
systemProp.org.gradle.internal.http.connectionTimeout=300000
systemProp.org.gradle.internal.http.socketTimeout=600000
systemProp.org.gradle.internal.http.retry=10
systemProp.org.gradle.internal.repository.max.retries=10
systemProp.org.gradle.internal.repository.initial.backoff.ms=2000
