// Applied via buildscript classpath (see root build.gradle) because the
// Gradle Plugin Portal is unreachable in this environment.
apply plugin: 'com.android.application'
apply plugin: 'org.jetbrains.kotlin.android'

android {
    namespace 'com.example.nasbrowser'
    compileSdk 35
    buildToolsVersion "34.0.0"

    defaultConfig {
        applicationId 'com.example.nasbrowser'
        minSdk 24
        targetSdk 35
        versionCode 15
        versionName '1.0.14'
    }

    signingConfigs {
        release {
            def propsFile = rootProject.file('release-signing.properties')
            if (propsFile.exists()) {
                def props = new Properties()
                props.load(new FileInputStream(propsFile))
                storeFile rootProject.file(props['storeFile'])
                storePassword props['storePassword']
                keyAlias props['keyAlias']
                keyPassword props['keyPassword']
            }
        }
    }

    buildTypes {
        release {
            signingConfig signingConfigs.release
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
        coreLibraryDesugaringEnabled true
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    buildFeatures {
        viewBinding true
    }

    lint {
        // Lint tooling isn't available in this offline toolchain build; the app
        // already compiles cleanly, so don't block release assembly on it.
        checkReleaseBuilds false
        abortOnError false
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.viewpager2:viewpager2:1.1.0'
    implementation 'androidx.fragment:fragment-ktx:1.8.4'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-ktx:2.8.4'
    implementation 'androidx.lifecycle:lifecycle-livedata-ktx:2.8.4'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.8.4'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.8.1'

    // EncryptedSharedPreferences for safe "remember password" storage (AndroidKeyStore-backed).
    implementation 'androidx.security:security-crypto:1.0.0'

    // SMB 2/3 client (pure Java, no root required). Prefers SMB 3.x dialects.
    implementation 'com.hierynomus:smbj:0.13.0'

    // jcifs-ng: used ONLY to enumerate the server's shares (the "root" of a NAS), since smbj
    // 0.13.0 cannot list shares. It performs the standard MS-RPC NetShareEnum over IPC$.
    implementation 'org.codelibs:jcifs:2.1.38'

    // Desugar JDK libs so jcifs-ng (and other Java 8+ code) runs on older Android versions.
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.0.4'
}
